# Blueprint Render — API Filtra.IA
# Para a API nativa Node, use rootDir=backend para limitar o contexto do serviço.
services:
  - type: web
    name: filtra-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    # tsx é dependência de produção; executar o TypeScript diretamente.
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
