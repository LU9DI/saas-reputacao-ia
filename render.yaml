# Blueprint Render — serviço existente filtra-ai-dot-api
# Mantém o repositório na raiz e instala dependências pelo lockfile de backend/.
services:
  - type: web
    name: filtra-ai-dot-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend --omit=dev --no-audit --no-fund
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
