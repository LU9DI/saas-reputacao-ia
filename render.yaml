# Blueprint Render — API Filtra.IA
# No dashboard: New → Blueprint → este repo, ou Web Service com rootDir=backend
services:
  - type: web
    name: filtra-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: filtra-db
          property: connectionString

databases:
  - name: filtra-db
    plan: free
    databaseName: filtra
    user: filtra
