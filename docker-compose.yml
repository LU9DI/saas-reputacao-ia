# Desenvolvimento local — API + web
# Uso: docker compose up --build
# Requer backend/.env com JWT_SECRET (e STRIPE_SECRET_KEY para checkout)

services:
  api:
    image: node:20-bookworm
    working_dir: /app/backend
    command: sh -c "npm install && npm run dev"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      SQLITE_DB_PATH: /app/data/database.sqlite
      APP_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000

  web:
    image: node:20-bookworm
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5000
    depends_on:
      - api
