name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-brand:
    name: SEO + brand guardrail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit public SEO/content rules
        run: node spec-kit/audit-seo-brand.mjs

      - name: Validate SEO routes and sitemap metadata
        working-directory: frontend
        run: node scripts/validate-seo.mjs

      - name: Validate programmatic SEO content quality
        working-directory: frontend
        run: node scripts/validate-programmatic-seo-content.mjs

  backend:
    name: Backend (test + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long
      SQLITE_DB_PATH: /tmp/filtra-ci.sqlite
      APP_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      ADMIN_EMAIL: admin-ci@example.com
      ADMIN_PASSWORD: AdminCi@Test1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          if ! npm ci; then
            echo "npm ci falhou — regenerando lock e instalando..."
            npm install
          fi

      - name: Unit tests
        run: |
          # Use npm exec so CI remains resilient if the lockfile is temporarily
          # out of sync with package.json and tsx is absent from node_modules/.bin.
          find tests -type f -name '*.test.ts' ! -name 'integration.*.test.ts' -print0 | xargs -0 -r -n1 npx --yes tsx --test

      # O teste de integração usa um SQLite temporário; os adaptadores são dependências exclusivas de CI.
      # Não alterar o package-lock nem adicionar dependências de teste ao runtime.
      - name: Install SQLite test dependencies
        run: npm install --no-save --package-lock=false sqlite@5.1.1 sqlite3@5.1.7

      # Este teste usa banco temporário e não depende de DNS ou serviços externos.
      # Mantê-lo sempre ativo protege os contratos de consentimento e aceite legal.
      - name: Focused integration tests (lead + legal acceptance)
        run: npx --yes tsx --test tests/integration.lead-legal.test.ts

      - name: Integration tests (external dependencies)
        if: ${{ hashFiles('backend/tests/integration.*.test.ts') != '' && env.CI_RUN_INTEGRATION == '1' }}
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

  # Export estático usado pela Cloudflare Pages. Mantém a auditoria de out/.
  frontend:
    name: Frontend (Cloudflare static export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5000
      # O passo "Audit static export indexability" valida o artefato de
      # exportação estática (out/), que só é gerado com CLOUDFLARE_PAGES=1.
      CLOUDFLARE_PAGES: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if ! npm ci; then
            echo "npm ci falhou — regenerando lock e instalando..."
            npm install
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build

      - name: Audit static export indexability
        run: npm run seo:audit

  # Build normal da Vercel: não define CLOUDFLARE_PAGES. O build não pode
  # depender de out/ nem do pós-processamento usado no export estático.
  frontend-vercel:
    name: Frontend (Vercel build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if ! npm ci; then
            echo "npm ci falhou — regenerando lock e instalando..."
            npm install
          fi

      - name: Build Next.js (Vercel mode)
        run: npm run build

      - name: Verify Vercel mode did not require static export
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_PAGES:-}"
          test ! -d out
          echo "Vercel-mode build passed without out/."

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [seo-brand, backend, frontend, frontend-vercel]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "SEO/brand: ${{ needs.seo-brand.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend (Cloudflare): ${{ needs.frontend.result }}"
          echo "Frontend (Vercel): ${{ needs['frontend-vercel'].result }}"
          if [ "${{ needs.seo-brand.result }}" != "success" ] || [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs['frontend-vercel'].result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
