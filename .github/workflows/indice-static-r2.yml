name: Índice - build estático e publicação R2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: indice
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: indice/package-lock.json
      - run: npm ci
      - name: Testes
        run: npm test && npm run typecheck
      - name: Build estático
        run: npm run build
      - name: Validar artefato
        run: |
          test -s out/index.html
          test -d out/_next/static
          node -e "const fs=require('node:fs'),p=require('node:path');let n=0,b=0;function w(d){for(const x of fs.readdirSync(d,{withFileTypes:true})){const f=p.join(d,x.name);if(x.isDirectory())w(f);else{n++;b+=fs.statSync(f).size}}}w('out');console.log(JSON.stringify({files:n,bytes:b,mb:+(b/1048576).toFixed(2)}));if(!n)process.exit(1)"
      - name: Validar credenciais R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            test -n "${!name}" || { echo "::error::Secret $name ausente"; exit 1; }
          done
      - name: Instalar AWS CLI
        run: python -m pip install --user awscli
      - name: Publicar em R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          "$HOME/.local/bin/aws" s3 sync out/ "s3://$R2_BUCKET_NAME/" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress
