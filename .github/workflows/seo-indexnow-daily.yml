name: SEO IndexNow Daily
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seo-indexnow-daily
  cancel-in-progress: false
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: frontend/.cache/indexnow-state.json
          key: indexnow-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-state-
      - run: npm ci
        working-directory: frontend
      - name: Build canonical static sitemap and HTML
        run: npm run build
        working-directory: frontend
        env:
          CLOUDFLARE_PAGES: '1'
      - name: Submit only new or changed eligible URLs
        run: npm run seo:indexnow
        working-directory: frontend
        env:
          INDEXNOW_STATE_FILE: .cache/indexnow-state.json
      - name: Verify production delivery
        run: npm run seo:smoke:production
        working-directory: frontend
