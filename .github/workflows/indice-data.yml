name: Índice - atualizar dados

# Baixa o CNPJ aberto da Receita, agrega por município e segmento e abre um PR com indice/data/.
# Não faz merge sozinho: um humano confere o resumo antes de publicar.
on:
  workflow_dispatch:
    inputs:
      competencia:
        description: 'AAAA-MM (vazio = mais recente disponível)'
        required: false
      base:
        description: 'br (CNPJ, padrão) ou us (County Business Patterns, EUA)'
        required: false
        default: 'br'
      sondar:
        description: 'true = só testar endereços de download (cabeçalhos, sem baixar)'
        required: false
      zip_inspecao:
        description: 'URL de um .zip: baixa e mostra a lista de arquivos, o cabeçalho e algumas linhas'
        required: false
      filtro_inspecao:
        description: 'regex (grep -E) aplicada às linhas do arquivo na inspeção'
        required: false
      urls_sonda:
        description: 'URLs extras (separadas por espaço) para a sondagem; se preenchido, só estas são testadas'
        required: false
  schedule:
    - cron: '0 6 15 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do agregador
        working-directory: indice
        run: npm ci && npm test
      - name: Inspecionar zip (opcional)
        if: ${{ inputs.zip_inspecao != '' }}
        env:
          ZIP: ${{ inputs.zip_inspecao }}
          FILTRO: ${{ inputs.filtro_inspecao }}
        run: |
          mkdir -p /tmp/insp
          case "$ZIP" in
            *.zip) ;;
            *) T=$(curl -sS -L -m 120 "$ZIP" | tr -d '\r' | head -12 | cut -c1-200 | base64 -w0); echo "::error title=Inspecao::$T"; exit 1;;
          esac
          curl -sS -L -m 300 -o /tmp/insp/a.zip "$ZIP"
          LIST=$(unzip -l /tmp/insp/a.zip | cut -c1-100)
          F=$(unzip -Z1 /tmp/insp/a.zip | head -1)
          if [ -n "$FILTRO" ]; then HEAD=$(unzip -p /tmp/insp/a.zip "$F" | grep -E "$FILTRO" | head -40 | cut -c1-160); else HEAD=$(unzip -p /tmp/insp/a.zip "$F" | head -6 | cut -c1-400); fi
          LINES=$(unzip -p /tmp/insp/a.zip "$F" | wc -l)
          MSG=$(printf '%s\nlinhas: %s\n%s' "$LIST" "$LINES" "$HEAD" | tr -d '\r' | head -c 20000 | base64 -w0)
          echo "::error title=Inspecao::${MSG}"
          exit 1
      - name: Sondar endereços (opcional)
        if: ${{ inputs.sondar == 'true' }}
        env:
          URLS: ${{ inputs.urls_sonda }}
        run: |
          OUT=""
          for u in $URLS; do
            c=$(curl -sS -L -I -m 40 -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$u" 2>&1 | tr -d '\n' | cut -c1-140)
            OUT="${OUT}${c} <- ${u:0:110}%0A"
          done
          echo "::error title=Sondagem::${OUT:-sem URLs}"
          exit 1
      - name: Ingestão
        working-directory: indice
        env:
          BASE: ${{ inputs.base }}
          COMP: ${{ inputs.competencia }}
        run: |
          set +e
          if [ "$BASE" = "us" ]; then
            node scripts/ingest-us.mjs 2>&1 | tee /tmp/ingest.log
          else
            ARGS=""
            if [ -n "$COMP" ]; then ARGS="--competencia=$COMP"; fi
            node scripts/ingest.mjs $ARGS 2>&1 | tee /tmp/ingest.log
          fi
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            # Anotação legível pela API (o download do log completo pode ser bloqueado).
            MSG=$(tail -n 25 /tmp/ingest.log | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Falha na ingestão::${MSG}"
            exit "$CODE"
          fi
      - name: Abrir PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base }}
        run: |
          if [ "$BASE" = "us" ]; then
            COMP=$(node -p "require('./indice/data-us/meta.json').ano")
            BR="indice/dados-us-$COMP"; DIR=indice/data-us; TIT="Índice EUA: dados CBP $COMP"
          else
            COMP=$(node -p "require('./indice/data/meta.json').competencia")
            BR="indice/dados-$COMP"; DIR=indice/data; TIT="Índice: dados $COMP"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add -f "$DIR"
          git commit -m "chore(indice): dados $BASE, $COMP"
          git push -u origin "$BR"
          gh pr create --title "$TIT" --body "Dados regenerados pelo workflow. Conferir meta.json antes do merge." --base main || echo "::warning title=PR::Não foi possível abrir o PR automaticamente. A branch $BR foi enviada; abra o PR manualmente."
