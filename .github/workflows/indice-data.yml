name: Índice - atualizar dados

# Baixa o CNPJ aberto da Receita, agrega por município e segmento e abre um PR com indice/data/.
# Não faz merge sozinho: um humano confere o resumo antes de publicar.
on:
  workflow_dispatch:
    inputs:
      competencia:
        description: 'AAAA-MM (vazio = mais recente disponível)'
        required: false
      sondar:
        description: 'true = só testar endereços de download (cabeçalhos, sem baixar)'
        required: false
  schedule:
    - cron: '0 6 15 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do agregador
        working-directory: indice
        run: npm ci && npm test
      - name: Sondar endereços (opcional)
        if: ${{ inputs.sondar == 'true' }}
        env:
          INDICE_RFB_SHARE_TOKEN: ${{ secrets.INDICE_RFB_SHARE_TOKEN }}
        run: |
          OUT=""
          add() { OUT="${OUT}$1%0A"; }
          T="$INDICE_RFB_SHARE_TOKEN"
          if [ -z "$T" ]; then
            add "BLOQUEADO: INDICE_RFB_SHARE_TOKEN não configurado; testes do link público/WebDAV foram pulados."
          fi
          for m in 2026-09 2026-10 2026-08; do
            u="https://dadosabertos.rfb.gov.br/CNPJ/dados_abertos_cnpj/$m/Cnaes.zip"
            c=$(curl -sS -L -o /dev/null -I -m 30 -w '%{http_code} %{content_type} %{size_download}' "$u" 2>/dev/null | tr -d '\n' | cut -c1-120)
            add "$c <- $u"
            if [ -n "$T" ]; then
              # O token é credencial e faz parte da URL do link público: nunca ecoe a URL.
              u="https://arquivos.receitafederal.gov.br/index.php/s/$T/download?path=%2F$m&files=Cnaes.zip"
              c=$(curl -sS -L -o /dev/null -I -m 30 -w '%{http_code} %{content_type} %{size_download}' "$u" 2>/dev/null | tr -d '\n' | cut -c1-120)
              add "$c <- link público (token omitido), competência $m"
            fi
          done
          if [ -n "$T" ]; then
            L=$(curl -sS -m 30 -u "$T:" -X PROPFIND -H 'Depth: 1' https://arquivos.receitafederal.gov.br/public.php/webdav/ 2>&1 | grep -o '<d:href>[^<]*' | sed 's/<d:href>//' | head -12 | tr '\n' ' ')
            add "webdav raiz: ${L:-vazio}"
          fi
          echo "::error title=Sondagem::${OUT}"
          exit 1
      - name: Ingestão
        env:
          INDICE_RFB_SHARE_TOKEN: ${{ secrets.INDICE_RFB_SHARE_TOKEN }}
        working-directory: indice
        run: |
          ARGS=""
          if [ -n "${{ inputs.competencia }}" ]; then ARGS="--competencia=${{ inputs.competencia }}"; fi
          set +e
          node scripts/ingest.mjs $ARGS 2>&1 | tee /tmp/ingest.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            # Anotação legível pela API (o download do log completo pode ser bloqueado).
            MSG=$(tail -n 25 /tmp/ingest.log | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Falha na ingestão::${MSG}"
            exit "$CODE"
          fi
      - name: Abrir PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMP=$(node -p "require('./indice/data/meta.json').competencia")
          BR="indice/dados-$COMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add -f indice/data
          git commit -m "chore(indice): dados do CNPJ aberto, competência $COMP"
          git push -u origin "$BR"
          gh pr create --title "Índice: dados $COMP" --body "Dados regenerados por indice/scripts/ingest.mjs. Conferir indice/data/meta.json (linhasLidas, UFs) antes do merge." --base main || echo "::warning title=PR::Não foi possível abrir o PR automaticamente (ajuste de permissão do Actions?). A branch $BR foi enviada; abra o PR manualmente."
