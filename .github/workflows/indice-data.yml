name: Índice - atualizar dados

# Baixa o CNPJ aberto da Receita, agrega por município e segmento e abre um PR com indice/data/.
# Não faz merge sozinho: um humano confere o resumo antes de publicar.
on:
  workflow_dispatch:
    inputs:
      competencia:
        description: 'AAAA-MM (vazio = mais recente disponível)'
        required: false
      sondar:
        description: 'true = só testar endereços de download (cabeçalhos, sem baixar)'
        required: false
      zip_inspecao:
        description: 'URL de um .zip: baixa e mostra a lista de arquivos, o cabeçalho e algumas linhas'
        required: false
      filtro_inspecao:
        description: 'regex (grep -E) aplicada às linhas do arquivo na inspeção'
        required: false
      urls_sonda:
        description: 'URLs extras (separadas por espaço) para a sondagem; se preenchido, só estas são testadas'
        required: false
  schedule:
    - cron: '0 6 15 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do agregador
        working-directory: indice
        run: npm ci && npm test
      - name: Inspecionar zip (opcional)
        if: ${{ inputs.zip_inspecao != '' }}
        env:
          ZIP: ${{ inputs.zip_inspecao }}
          FILTRO: ${{ inputs.filtro_inspecao }}
        run: |
          mkdir -p /tmp/insp && curl -sS -L -m 300 -o /tmp/insp/a.zip "$ZIP"
          LIST=$(unzip -l /tmp/insp/a.zip | cut -c1-100)
          F=$(unzip -Z1 /tmp/insp/a.zip | head -1)
          if [ -n "$FILTRO" ]; then HEAD=$(unzip -p /tmp/insp/a.zip "$F" | grep -E "$FILTRO" | head -40 | cut -c1-160); else HEAD=$(unzip -p /tmp/insp/a.zip "$F" | head -6 | cut -c1-400); fi
          LINES=$(unzip -p /tmp/insp/a.zip "$F" | wc -l)
          MSG=$(printf '%s\n\nlinhas: %s\n%s' "$LIST" "$LINES" "$HEAD" | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Inspecao::${MSG}"
          exit 1
      - name: Sondar endereços (opcional)
        if: ${{ inputs.sondar == 'true' }}
        env:
          URLS: ${{ inputs.urls_sonda }}
        run: |
          OUT=""
          for u in $URLS; do
            c=$(curl -sS -L -I -m 40 -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$u" 2>&1 | tr -d '\n' | cut -c1-140)
            OUT="${OUT}${c} <- ${u:0:110}%0A"
          done
          echo "::error title=Sondagem::${OUT:-sem URLs}"
          exit 1
      - name: Ingestão
        env:
          INDICE_RFB_SHARE_TOKEN: ${{ secrets.INDICE_RFB_SHARE_TOKEN }}
        working-directory: indice
        run: |
          if [ -n "$INDICE_RFB_SHARE_TOKEN" ]; then echo "::add-mask::$INDICE_RFB_SHARE_TOKEN"; fi
          if [ -z "$INDICE_RFB_SHARE_TOKEN" ]; then
            echo "::error title=Ingestão::INDICE_RFB_SHARE_TOKEN não configurado; nenhum download foi iniciado."
            exit 1
          fi
          ARGS=""
          if [ -n "${{ inputs.competencia }}" ]; then ARGS="--competencia=${{ inputs.competencia }}"; fi
          set +e
          node scripts/ingest.mjs $ARGS 2>&1 | tee /tmp/ingest.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            # Anotação legível pela API (o download do log completo pode ser bloqueado).
            MSG=$(tail -n 25 /tmp/ingest.log | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Falha na ingestão::${MSG}"
            exit "$CODE"
          fi
      - name: Abrir PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMP=$(node -p "require('./indice/data/meta.json').competencia")
          BR="indice/dados-$COMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add -f indice/data
          git commit -m "chore(indice): dados do CNPJ aberto, competência $COMP"
          git push -u origin "$BR"
          gh pr create --title "Índice: dados $COMP" --body "Dados regenerados por indice/scripts/ingest.mjs. Conferir indice/data/meta.json (linhasLidas, UFs) antes do merge." --base main || echo "::warning title=PR::Não foi possível abrir o PR automaticamente (ajuste de permissão do Actions?). A branch $BR foi enviada; abra o PR manualmente."
