name: Índice - atualizar dados

# Gera os dados do Índice e abre um branch com os arquivos (indice/data ou indice/data-us).
# Não faz merge sozinho: um humano confere o resumo antes de publicar.
#   pais=br (padrão): CNPJ aberto da Receita Federal, por município e segmento.
#   pais=us: County Business Patterns do Census Bureau, por condado e segmento.
on:
  workflow_dispatch:
    inputs:
      pais:
        description: 'br (padrão) ou us'
        required: false
        default: 'br'
      competencia:
        description: 'br: AAAA-MM (vazio = mais recente). us: ano, ex. 2023 (vazio = 2023)'
        required: false
  schedule:
    - cron: '0 6 15 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PAIS: ${{ inputs.pais || 'br' }}
      COMP: ${{ inputs.competencia }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes
        working-directory: indice
        run: npm ci && npm test
      - name: Ingestão
        working-directory: indice
        run: |
          set +e
          if [ "$PAIS" = "us" ]; then
            ARGS=""; if [ -n "$COMP" ]; then ARGS="--ano=$COMP"; fi
            node scripts/ingest-us.mjs $ARGS 2>&1 | tee /tmp/ingest.log
          else
            ARGS=""; if [ -n "$COMP" ]; then ARGS="--competencia=$COMP"; fi
            node scripts/ingest.mjs $ARGS 2>&1 | tee /tmp/ingest.log
          fi
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            # Anotação legível pela API (o download do log completo pode ser bloqueado).
            MSG=$(tail -n 25 /tmp/ingest.log | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Falha na ingestão::${MSG}"
            exit "$CODE"
          fi
          # Resumo legível pela API mesmo quando o PR não puder ser aberto.
          RES=$(tail -n 8 /tmp/ingest.log | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Resumo da ingestão::${RES}"
      - name: Enviar branch e abrir PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PAIS" = "us" ]; then
            DIR=indice/data-us; REF=$(node -p "require('./indice/data-us/meta.json').year"); BR="indice/dados-us-$REF"
          else
            DIR=indice/data; REF=$(node -p "require('./indice/data/meta.json').competencia"); BR="indice/dados-$REF"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add -f "$DIR"
          git commit -m "chore(indice): dados ($PAIS) $REF"
          git push -u origin "$BR"
          gh pr create --title "Índice: dados $PAIS $REF" --body "Gerado por indice/scripts. Conferir meta.json antes do merge." --base main || echo "::warning title=PR::Não foi possível abrir o PR automaticamente. A branch $BR foi enviada; abra o PR manualmente."
