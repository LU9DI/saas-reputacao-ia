name: Índice - atualizar dados

# Baixa o CNPJ aberto da Receita, agrega por município e segmento e abre um PR com indice/data/.
# Não faz merge sozinho: um humano confere o resumo antes de publicar.
on:
  workflow_dispatch:
    inputs:
      competencia:
        description: 'AAAA-MM (vazio = mais recente disponível)'
        required: false
      so_ibge:
        description: 'Só testa a consulta ao IBGE e sai (true/false)'
        required: false
      retomar_run_id:
        description: 'ID de uma execução anterior com o artefato agregado (evita rebaixar a base)'
        required: false
      max_linhas:
        description: 'Só teste rápido do fluxo (ex.: 2000000). Não abre PR.'
        required: false
  schedule:
    - cron: '0 6 15 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do agregador
        working-directory: indice
        run: npm ci && npm test
      - name: Baixar agregado da execução anterior
        if: ${{ inputs.retomar_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: agregado
          path: indice/.tmp
          run-id: ${{ inputs.retomar_run_id }}
          github-token: ${{ github.token }}
      - name: Ingestão
        working-directory: indice
        run: |
          ARGS=""
          if [ -n "${{ inputs.competencia }}" ]; then ARGS="--competencia=${{ inputs.competencia }}"; fi
          if [ "${{ inputs.so_ibge }}" = "true" ]; then ARGS="$ARGS --so-ibge"; fi
          if [ -n "${{ inputs.retomar_run_id }}" ]; then ARGS="$ARGS --retomar=.tmp/agregado.json"; fi
          if [ -n "${{ inputs.max_linhas }}" ]; then ARGS="$ARGS --max-linhas=${{ inputs.max_linhas }}"; fi
          node scripts/ingest.mjs $ARGS
      - name: Guardar agregado (checkpoint)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agregado
          path: indice/.tmp/agregado.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Abrir PR
        if: ${{ inputs.max_linhas == '' && inputs.so_ibge != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMP=$(node -p "require('./indice/data/meta.json').competencia")
          BR="indice/dados-$COMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add -f indice/data
          git commit -m "chore(indice): dados do CNPJ aberto, competência $COMP"
          git push -u origin "$BR"
          gh pr create --title "Índice: dados $COMP" --body "Dados regenerados por indice/scripts/ingest.mjs. Conferir indice/data/meta.json (linhasLidas, UFs) antes do merge." --base main
