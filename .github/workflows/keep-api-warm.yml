name: Keep Filtra.AI API warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep-warm:
    name: Ping Render API health
    runs-on: ubuntu-latest
    steps:
      - name: Wake API
        env:
          API_URL: https://filtra-ia-api.onrender.com
        run: |
          set -euo pipefail
          url="${API_URL%/}/api/health"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 25 "$url")"
          echo "API health status: $status"
          case "$status" in
            2??|3??) exit 0 ;;
            *) exit 1 ;;
          esac
