name: Deploy

# Template de CD. Ative o deploy real descomentando o job e configurando secrets.
# Opções comuns: Railway, Render, Fly.io, Vercel (frontend), Docker VPS.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Ambiente de deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  gate:
    name: Só deploy se CI passou
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: OK para deploy
        run: echo "CI verde — deploy autorizado"

