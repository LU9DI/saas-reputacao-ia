name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Ambiente'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  gate:
    name: Gate (CI deve estar verde)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - run: echo "Deploy autorizado"

  deploy-api-railway:
    name: API → Railway
    needs: gate
    runs-on: ubuntu-latest
    # Só roda se o secret existir (evita falha em forks/PRs sem secret)
    if: ${{ vars.ENABLE_RAILWAY_DEPLOY == 'true' || secrets.RAILWAY_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN não configurado — pulando deploy da API."
            echo "Veja DEPLOY.md para ativar."
            exit 0
          fi
          # Link implícito via token do projeto/serviço no Railway dashboard
          railway up --service "${{ secrets.RAILWAY_SERVICE_ID || 'api' }}" --detach || railway up --detach

  deploy-web-vercel:
    name: Frontend → Vercel
    needs: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy Frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Secrets da Vercel incompletos — pulando deploy do frontend."
            echo "Configure VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID. Veja DEPLOY.md."
            exit 0
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
