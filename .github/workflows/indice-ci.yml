name: Índice Filtra.AI

on:
  pull_request:
    paths:
      - 'indice/**'
      - '.github/workflows/indice-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'indice/**'
      - '.github/workflows/indice-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build + canonical/redirect checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indice
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: indice/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: SEO integration checks
        run: npm run test:seo
