name: cloudflare-pages-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CLOUDFLARE_PAGES: "1"
          NEXT_PUBLIC_APP_URL: "https://filtraai.com"
          NEXT_PUBLIC_API_URL: "https://filtra-ia-api.onrender.com"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: aece1b8443957c1c37b4fd48f933379b
        run: npx wrangler@4 pages deploy out --project-name=filtra-ai-fallback-direct --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$GITHUB_SHA"
