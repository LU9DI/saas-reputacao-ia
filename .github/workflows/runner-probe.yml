name: Runner probe

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    name: Runner provisioning probe
    runs-on: ubuntu-slim
    steps:
      - name: Runner started
        run: |
          echo "runner_probe=started"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          node --version
          npm --version
