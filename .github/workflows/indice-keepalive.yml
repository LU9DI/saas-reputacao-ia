name: Índice - manter acordado

# O Índice roda no plano free do Render, que dorme após ~15 min sem tráfego.
# Uma requisição periódica evita a primeira resposta lenta (ou 502) para o Googlebot.
# O cron do GitHub é "melhor esforço": pode atrasar alguns minutos.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indice-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Requisitar o índice de sitemaps
        run: |
          # Até 4 tentativas com espera: a primeira pode acordar o serviço (cold start ~30-60 s).
          for i in 1 2 3 4; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 https://filtraai.com/indice/sitemap-index.xml || echo 000)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Índice não respondeu 200 em https://filtraai.com/indice/sitemap-index.xml (último HTTP $code)"
          exit 1
