name: Índice - manter acordado

# O Índice roda no plano free do Render e pode dormir após ~15 min sem tráfego.
# Acordar tanto o índice quanto o shard faz o Worker manter respostas válidas em cache.
# O cron do GitHub é "melhor esforço": pode atrasar alguns minutos.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indice-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Aquecer índice e shard do sitemap
        shell: bash
        run: |
          set -u
          failed=0
          for endpoint in \
            "https://filtraai.com/indice/sitemap-index.xml" \
            "https://filtraai.com/indice/sitemap/0.xml"; do
            success=0
            for attempt in 1 2 3 4; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 40 "$endpoint" || true)
              echo "$endpoint — tentativa $attempt: HTTP ${code:-000}"
              if [ "$code" = "200" ]; then
                success=1
                break
              fi
              if [ "$attempt" -lt 4 ]; then sleep 10; fi
            done
            if [ "$success" -ne 1 ]; then
              echo "::error::Índice não respondeu HTTP 200: $endpoint"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]
