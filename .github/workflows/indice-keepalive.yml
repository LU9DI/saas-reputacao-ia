name: Índice - verificação manual

# Execução manual apenas. Não manter o serviço Render acordado continuamente:
# o keepalive frequente consome a cota compartilhada de horas do plano Free.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indice-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar índice e sitemap (sem retries prolongados)
        shell: bash
        run: |
          set -u
          failed=0
          for endpoint in \
            "https://filtraai.com/indice/sitemap-index.xml" \
            "https://filtraai.com/indice/sitemap/0.xml"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$endpoint" || true)
            echo "$endpoint — HTTP ${code:-000}"
            if [ "$code" != "200" ]; then
              echo "::error::Endpoint não respondeu HTTP 200: $endpoint"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]
