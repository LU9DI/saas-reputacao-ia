name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: root
            directory: .
          - package: backend
            directory: backend
          - package: frontend
            directory: frontend
          - package: indice
            directory: indice
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory == '.' && 'package-lock.json' || format('{0}/package-lock.json', matrix.directory) }}
      - name: Install exactly from lockfile
        working-directory: ${{ matrix.directory }}
        run: npm ci
      - name: Report high and critical dependency vulnerabilities
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high
