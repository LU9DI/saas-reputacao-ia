name: browser-e2e

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Frontend URL to test'
        required: false
        default: 'http://127.0.0.1:3000'
      review_url:
        description: 'Optional public evaluation URL for the WhatsApp E2E'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-browser.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'http://127.0.0.1:3000' }}
      E2E_REVIEW_URL: ${{ github.event.inputs.review_url || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          if ! npm ci; then
            echo "npm ci falhou — regenerando lock e instalando..."
            npm install
          fi
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm start > /tmp/filtra-frontend.log 2>&1 &
      - run: npx playwright test
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/filtra-frontend.log
          retention-days: 7
