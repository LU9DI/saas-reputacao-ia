name: Deploy Filtra.AI frontend to Cloudflare Pages
# Build once in GitHub Actions and publish only the static artifact to Pages.

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build → Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES: '1'
      NEXT_PUBLIC_API_URL: https://filtra-ia-api.onrender.com
      NEXT_PUBLIC_APP_URL: https://filtraai.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Temporarily exclude Vercel-only cron route
        shell: bash
        run: |
          set -euo pipefail
          if [ -d src/app/api/cron/keep-warm ]; then
            mv src/app/api/cron/keep-warm /tmp/filtra-keep-warm
            echo "moved=1" >> "$GITHUB_ENV"
          else
            echo "moved=0" >> "$GITHUB_ENV"
          fi

      - name: Build static export
        run: npm run build

      - name: Verify static artifact
        run: |
          set -euo pipefail
          test -d out
          test -f out/index.html
          test -f out/404.html
          echo "Static artifact ready: $(du -sh out | cut -f1)"

      - name: Restore Vercel-only cron route
        if: always() && env.moved == '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/app/api/cron
          rm -rf src/app/api/cron/keep-warm
          mv /tmp/filtra-keep-warm src/app/api/cron/keep-warm

      - name: Deploy static artifact to Cloudflare Pages
        if: success()
        working-directory: frontend
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler@latest pages deploy out \
            --project-name=filtra-ai-fallback-direct \
            --branch=main \
            --commit-message="Cloudflare Pages \${GITHUB_SHA}" \
            --commit-hash="\${GITHUB_SHA}"
