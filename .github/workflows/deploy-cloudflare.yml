name: Deploy Frontend to Cloudflare Pages
# trigger: keep direct Pages deployment path active

on:
  push:
    branches:
      - main
      - seo-top3-20261005
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Frontend → Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Temporarily exclude Vercel-only cron route
        run: |
          set -e
          if [ -d src/app/api/cron/keep-warm ]; then
            mv src/app/api/cron/keep-warm /tmp/filtra-keep-warm
            echo 'moved=1' >> "$GITHUB_ENV"
          else
            echo 'moved=0' >> "$GITHUB_ENV"
          fi

      - name: Build static export
        run: npm run build

      - name: Restore Vercel-only cron route
        if: always() && env.moved == '1'
        run: |
          mkdir -p src/app/api/cron
          rm -rf src/app/api/cron/keep-warm
          mv /tmp/filtra-keep-warm src/app/api/cron/keep-warm

      - name: Deploy to Cloudflare Pages
        if: success()
        run: |
          set -e
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in GitHub Actions secrets.'
            exit 1
          fi
          npx wrangler@latest pages deploy out             --project-name=filtra-ai-fallback-direct             --branch=main             --commit-message="Cloudflare deploy ${GITHUB_SHA}"             --commit-hash="${GITHUB_SHA}"

# deployment trigger: 2026-10-06
