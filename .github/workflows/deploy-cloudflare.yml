name: Deploy Filtra.AI frontend to Cloudflare Pages
# Production frontend deployment: GitHub Actions → Cloudflare Pages.
# Vercel is not part of the production frontend path.

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build → Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES: '1'
      NEXT_PUBLIC_API_URL: https://filtra-ia-api.onrender.com
      NEXT_PUBLIC_APP_URL: https://filtraai.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate SEO source metadata and routes
        run: npm run seo:validate

      - name: Build static export
        run: npm run build

      - name: Audit static export indexability
        run: npm run seo:audit

      - name: Validate Markdown twins and llms files
        run: npm run seo:markdown:validate

      - name: Verify static artifact
        run: |
          set -euo pipefail
          test -d out
          test -f out/index.html
          test -f out/404.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/planos.html
          grep -q 'https://filtraai.com/planos' out/sitemap.xml
          grep -q 'https://filtraai.com/planos' out/planos.html
          test -f out/a3d7f1c94b2e6a805d1f7c3b9e4a6d82.txt
          grep -q 'https://filtraai.com/en' out/sitemap.xml
          grep -q 'https://filtraai.com/es' out/sitemap.xml
          # ZH routes remain accessible with noindex but must stay out of sitemap.
          if grep -q 'https://filtraai.com/zh' out/sitemap.xml; then
            echo "ZH URLs are noindex and must not appear in sitemap.xml" >&2
            exit 1
          fi
          grep -q 'https://filtraai.com/en/blog/ai-review-analysis-guide' out/sitemap.xml
          grep -q 'https://filtraai.com/es/blog/analisis-resenas-ia' out/sitemap.xml
          # Apos o PR #55: paginas privadas sao crawlable com noindex no HTML;
          # no robots.txt apenas /api/ permanece bloqueado.
          grep -q 'Disallow: /api/' out/robots.txt
          grep -q 'Sitemap: https://filtraai.com/sitemap.xml' out/robots.txt
          grep -qx 'a3d7f1c94b2e6a805d1f7c3b9e4a6d82' out/a3d7f1c94b2e6a805d1f7c3b9e4a6d82.txt
          echo "Static artifact ready: $(du -sh out | cut -f1)"
          echo "Sitemap URL count: $(grep -o '<loc>' out/sitemap.xml | wc -l)"

      - name: Deploy to Cloudflare Pages
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler@latest pages deploy out \
            --project-name=filtra-ai-fallback-direct \
            --branch=main \
            --commit-message="Cloudflare Pages ${GITHUB_SHA}" \
            --commit-hash="${GITHUB_SHA}"

      - name: Submit sitemap URLs to IndexNow
        run: npm run seo:indexnow
